version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pharmapulse-postgres
    restart: always
    environment:
      POSTGRES_USER: pharmapulse
      POSTGRES_PASSWORD: pharmapulse_secret
      POSTGRES_DB: pharmapulse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmapulse -d pharmapulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python AI & ML Analytics Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: pharmapulse-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgres

  # 3. Node.js & Express REST Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmapulse-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://pharmapulse:pharmapulse_secret@postgres:5432/pharmapulse_db?schema=public
      - JWT_SECRET=pharmapulse-super-secret-sih-2026-key
      - AI_SERVICE_URL=http://ai-service:8000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  # 4. React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmapulse-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
